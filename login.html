<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | پنل سازمانی نامبرلند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-card">

    <!-- Logo -->
    <div class="login-logo-wrap">
        <img src="" alt="NumberLand" class="login-logo-img">
    </div>

    <!-- Auth Tabs -->
    <div class="auth-tabs">
        <button class="auth-tab active" id="atab-login">ورود</button>
        <button class="auth-tab" id="atab-register">ثبت نام</button>
    </div>

    <!-- ===== LOGIN PANEL ===== -->
    <div id="apanel-login" class="auth-panel active">

        <div class="fgroup">
            <label>شماره موبایل یا ایمیل سازمانی</label>
            <div class="iw">
                <span class="iicon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                    </svg>
                </span>
                <input id="lusername" type="text" class="fi" placeholder="example@company.com">
            </div>
        </div>

        <div class="fgroup">
            <label>رمز عبور</label>
            <div class="iw">
                <span class="iicon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                    </svg>
                </span>
                <input id="lpassword" type="password" class="fi" placeholder="رمز عبور">
            </div>
        </div>

        <button onclick="doLogin()" class="btn-prim">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
            </svg>
            ورود به پنل
        </button>

        <p id="lerror"></p>

        <div class="login-footer">
            <p>دسترسی سازمانی ندارید؟</p>
            <p>تماس با پشتیبانی نامبرلند</p>
        </div>

    </div>

    <!-- ===== REGISTER PANEL ===== -->
    <div id="apanel-register" class="auth-panel">

        <!-- Step 1: Registration Form -->
        <div id="reg-step1">

            <div class="fgroup">
                <label>شماره موبایل <span style="color:#EF4444">*</span></label>
                <div class="iw">
                    <span class="iicon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 8.25h3"/>
                        </svg>
                    </span>
                    <input id="reg-mobile" type="tel" class="fi" placeholder="09xxxxxxxxx">
                </div>
            </div>

            <div class="fgroup">
                <label>نام شرکت <span style="color:#EF4444">*</span></label>
                <div class="iw">
                    <span class="iicon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/>
                        </svg>
                    </span>
                    <input id="reg-company" type="text" class="fi" placeholder="نام شرکت یا سازمان">
                </div>
            </div>

            <div class="fgroup">
                <label>ایمیل سازمانی <span style="color:#EF4444">*</span></label>
                <div class="iw">
                    <span class="iicon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
                        </svg>
                    </span>
                    <input id="reg-email" type="email" class="fi" placeholder="example@company.com">
                </div>
            </div>

            <div class="fgroup">
                <label>طریقه آشنایی با نامبرلند</label>
                <div class="iw">
                    <span class="iicon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/>
                        </svg>
                    </span>
                    <select id="reg-source" class="fi" style="padding-right:40px;cursor:pointer;">
                        <option value="">انتخاب کنید</option>
                        <option value="friends">دوستان و آشنایان</option>
                        <option value="social">شبکه‌های اجتماعی (اینستاگرام، تلگرام و ...)</option>
                        <option value="search">موتور جستجو (گوگل و ...)</option>
                        <option value="ads">تبلیغات اینترنتی</option>
                        <option value="event">رویداد یا همایش</option>
                        <option value="other">سایر</option>
                    </select>
                </div>
            </div>

            <button onclick="doRegister()" class="btn-prim" id="reg-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
                </svg>
                <span id="reg-btn-txt">دریافت کد تأیید</span>
            </button>

            <p id="rerror"></p>

        </div>

        <!-- Step 2: OTP Verification -->
        <div id="reg-step2" class="hid">

            <p class="otp-phone" id="otp-phone-display"></p>

            <div class="otp-demo-box">
                <p>کد آزمایشی (فقط برای دمو)</p>
                <span class="otp-demo-code" id="otp-demo-val"></span>
            </div>

            <div class="fgroup">
                <label>کد تأیید ۴ رقمی</label>
                <input id="otp-input" type="text" class="fi fi-otp" placeholder="- - - -" maxlength="4" inputmode="numeric">
            </div>

            <button onclick="doVerifyOtp()" class="btn-prim" id="otp-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                </svg>
                <span id="otp-btn-txt">تأیید و ثبت نام</span>
            </button>

            <p id="otperror"></p>

            <button class="otp-back" onclick="goBackToRegForm()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:13px;height:13px;display:inline;vertical-align:middle;margin-left:4px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                </svg>
                ویرایش اطلاعات
            </button>

        </div>

    </div>

</div>

<div id="toast-cnt"></div>

<script src="script.js"></script>
</body>
</html>
